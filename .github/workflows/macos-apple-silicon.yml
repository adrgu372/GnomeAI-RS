name: macOS Apple Silicon

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tag-release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Create the validated version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gnomef-rs") | .version')"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "GnomeAI-RS ${tag}"
          git push origin "$tag"

  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gnomef-rs") | .version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Release build
        run: cargo build --release --locked
      - name: Import Developer ID identities
        if: github.event_name != 'pull_request' && env.MACOS_SIGNING_P12 != ''
        run: |
          test -n "$MACOS_SIGNING_P12_PASSWORD"
          signing_file="$RUNNER_TEMP/gnomeai-signing.p12"
          keychain="$RUNNER_TEMP/gnomeai-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$signing_file"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_file" -k "$keychain" \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign \
            -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          app_identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          installer_identity="$(security find-identity -v -p basic "$keychain" \
            | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -n 1)"
          test -n "$app_identity"
          test -n "$installer_identity"
          echo "GNOMEAI_APP_SIGN_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "GNOMEAI_INSTALLER_SIGN_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
      - name: Configure notarization
        if: github.event_name != 'pull_request' && env.APP_STORE_CONNECT_KEY_P8 != ''
        run: |
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          notary_key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$notary_key"
          chmod 0600 "$notary_key"
          echo "GNOMEAI_NOTARY_KEY=$notary_key" >> "$GITHUB_ENV"
          echo "GNOMEAI_NOTARY_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "GNOMEAI_NOTARY_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Package Apple Silicon release
        env:
          GNOMEAI_SKIP_BUILD: "1"
        run: bash scripts/build-macos-arm64.sh
      - name: Create macOS release notice
        run: |
          notice="dist/macos-release-notice.md"
          if [[ -n "${GNOMEAI_NOTARY_KEY:-}" ]]; then
            cat > "$notice" <<'EOF'
          ## macOS security

          This macOS build is signed with a Developer ID certificate and notarized by Apple.
          EOF
          elif [[ -n "${GNOMEAI_APP_SIGN_IDENTITY:-}" ]]; then
            cat > "$notice" <<'EOF'
          ## Important macOS security notice

          This macOS build is Developer ID signed, but it is **not notarized by Apple**. Gatekeeper may ask for confirmation when it is opened for the first time.
          EOF
          else
            cat > "$notice" <<'EOF'
          ## Important macOS security notice

          This macOS build is ad-hoc signed and is **not signed with a paid Apple Developer ID certificate or notarized by Apple**. The project does not currently pay for Apple Developer Program membership, so Gatekeeper will identify the developer as unverified and may block the installer on first open. This is expected for this release.

          To install it:

          1. Open the DMG and double-click `Install GnomeAI-RS.pkg` once.
          2. If macOS blocks it, open **System Settings → Privacy & Security**, scroll to **Security**, then click **Open Anyway** and confirm.
          3. If an installed app is blocked on first launch, Control-click it in `/Applications`, choose **Open**, then confirm **Open**.

          Only bypass Gatekeeper when the files came from this official GitHub release. Download the DMG, PKG, and SHA-256 file into the same directory and verify them with:

          ```bash
          shasum -a 256 -c GnomeAI-RS-*-macos-arm64.sha256
          ```
          EOF
          fi
      - name: Upload macOS arm64 packages
        uses: actions/upload-artifact@v4
        with:
          name: GnomeAI-RS-macos-arm64
          path: |
            dist/GnomeAI-RS-*-macos-arm64.pkg
            dist/GnomeAI-RS-*-macos-arm64.dmg
            dist/GnomeAI-RS-*-macos-arm64.sha256
            dist/macos-release-notice.md
          if-no-files-found: error

  build-debian-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gnomef-rs") | .version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build Debian binaries
        run: cargo build --release --locked
      - name: Package Debian release
        env:
          GNOMEAI_SKIP_BUILD: "1"
        run: |
          bash scripts/build-deb.sh
          deb="$(printf '%s\n' dist/gnomeai-rs_*_amd64.deb)"
          sha256sum "$deb" > "${deb}.sha256"
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: GnomeAI-RS-debian-amd64
          path: |
            dist/gnomeai-rs_*_amd64.deb
            dist/gnomeai-rs_*_amd64.deb.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-macos-arm64
      - build-debian-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated macOS package
        uses: actions/download-artifact@v4
        with:
          name: GnomeAI-RS-macos-arm64
          path: dist
      - name: Download validated Debian package
        uses: actions/download-artifact@v4
        with:
          name: GnomeAI-RS-debian-amd64
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notice="$(cat dist/macos-release-notice.md)"
          gh release create "$GITHUB_REF_NAME" \
            dist/GnomeAI-RS-*-macos-arm64.pkg \
            dist/GnomeAI-RS-*-macos-arm64.dmg \
            dist/GnomeAI-RS-*-macos-arm64.sha256 \
            dist/gnomeai-rs_*_amd64.deb \
            dist/gnomeai-rs_*_amd64.deb.sha256 \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "GnomeAI-RS ${GITHUB_REF_NAME}" \
            --notes "$release_notice" \
            --generate-notes
