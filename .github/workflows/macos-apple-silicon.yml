name: macOS Apple Silicon

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gnomef-rs") | .version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -n "$MACOS_SIGNING_P12"
          test -n "$MACOS_SIGNING_P12_PASSWORD"
          test -n "$APP_STORE_CONNECT_KEY_P8"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Release build
        run: cargo build --release --locked
      - name: Import Developer ID identities
        if: github.event_name != 'pull_request' && env.MACOS_SIGNING_P12 != ''
        run: |
          test -n "$MACOS_SIGNING_P12_PASSWORD"
          signing_file="$RUNNER_TEMP/gnomeai-signing.p12"
          keychain="$RUNNER_TEMP/gnomeai-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$signing_file"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_file" -k "$keychain" \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign \
            -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          app_identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          installer_identity="$(security find-identity -v -p basic "$keychain" \
            | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -n 1)"
          test -n "$app_identity"
          test -n "$installer_identity"
          echo "GNOMEAI_APP_SIGN_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "GNOMEAI_INSTALLER_SIGN_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
      - name: Configure notarization
        if: github.event_name != 'pull_request' && env.APP_STORE_CONNECT_KEY_P8 != ''
        run: |
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          notary_key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$notary_key"
          chmod 0600 "$notary_key"
          echo "GNOMEAI_NOTARY_KEY=$notary_key" >> "$GITHUB_ENV"
          echo "GNOMEAI_NOTARY_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "GNOMEAI_NOTARY_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Package Apple Silicon release
        env:
          GNOMEAI_SKIP_BUILD: "1"
        run: bash scripts/build-macos-arm64.sh
      - name: Upload macOS arm64 packages
        uses: actions/upload-artifact@v4
        with:
          name: GnomeAI-RS-macos-arm64
          path: |
            dist/GnomeAI-RS-*-macos-arm64.pkg
            dist/GnomeAI-RS-*-macos-arm64.dmg
            dist/GnomeAI-RS-*-macos-arm64.sha256
          if-no-files-found: error

  publish-macos-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated macOS package
        uses: actions/download-artifact@v4
        with:
          name: GnomeAI-RS-macos-arm64
          path: dist
      - name: Publish versioned macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/GnomeAI-RS-*-macos-arm64.pkg \
            dist/GnomeAI-RS-*-macos-arm64.dmg \
            dist/GnomeAI-RS-*-macos-arm64.sha256 \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "GnomeAI-RS ${GITHUB_REF_NAME} — macOS Apple Silicon" \
            --generate-notes
