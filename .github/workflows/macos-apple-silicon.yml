name: macOS Apple Silicon

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Package Apple Silicon release
        env:
          GNOMEAI_SKIP_BUILD: "1"
        run: bash scripts/build-macos-arm64.sh
      - name: Upload macOS arm64 packages
        uses: actions/upload-artifact@v4
        with:
          name: GnomeAI-RS-macos-arm64
          path: |
            dist/GnomeAI-RS-*-macos-arm64.tar.gz
            dist/GnomeAI-RS-*-macos-arm64.dmg
          if-no-files-found: error

  publish-v1-2-2-dmg:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated macOS package
        uses: actions/download-artifact@v4
        with:
          name: GnomeAI-RS-macos-arm64
          path: dist
      - name: Publish macOS-only v1.2.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(find dist -maxdepth 1 -type f -name 'GnomeAI-RS-*-macos-arm64.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" dist/GnomeAI-RS-1.2.2-macos-arm64.dmg
          gh release create v1.2.2 dist/GnomeAI-RS-1.2.2-macos-arm64.dmg \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "GnomeAI-RS v1.2.2 — macOS Apple Silicon" \
            --notes "macOS Apple Silicon release. This release contains only the DMG package; the Linux .deb remains unchanged in v1.2.1."
