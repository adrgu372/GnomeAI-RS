name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  avalonia:
    name: Avalonia UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('ui/GnomeAI.UI/*.csproj') }}

      - name: Check Avalonia UI contracts
        run: python3 scripts/check-avalonia-ui.py

      - name: Build (Release)
        run: dotnet build ui/GnomeAI.UI/GnomeAI.UI.csproj -c Release

      - name: Publish self-contained smoke check
        run: dotnet publish ui/GnomeAI.UI/GnomeAI.UI.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o dist/ui-smoke

  # Ubuntu: the GitHub runner already executes as an unprivileged user.
  ubuntu:
    name: Ubuntu build · test · smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libdbus-1-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Install as unprivileged user
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/gnomeai-rs"
          install -m 0755 target/release/gnomef-rs "$HOME/.local/bin/"
          install -m 0755 target/release/gnomef-agent "$HOME/.local/bin/"
          test -x target/release/gnomef-whatsapp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke run · native agent CLI
        run: |
          gnomef-rs --help
          gnomef-agent --help

  # Debian: container starts as root, so create and switch to a regular user —
  # the applications must build, install and run without any privileges.
  debian:
    name: Debian 12 unprivileged build · run
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git pkg-config sudo \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev
          useradd -m -s /bin/bash builder

      - uses: actions/checkout@v4

      - name: Hand the checkout to the unprivileged user
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/builder/src
          chown -R builder:builder /home/builder/src

      - name: Build, test, install and smoke-run as `builder`
        run: |
          sudo -iu builder bash -e <<'SCRIPT'
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          cd "$HOME/src"
          cargo build --release --locked
          cargo test --release --locked
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/gnomeai-rs"
          install -m 0755 target/release/gnomef-rs "$HOME/.local/bin/"
          export PATH="$HOME/.local/bin:$PATH"
          gnomef-rs --help
          SCRIPT
