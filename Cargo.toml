[package]
name = "gnomef-rs"
version = "3.0.0"
edition = "2024"
rust-version = "1.91"
autobins = false
default-run = "gnomef-rs"

[[bin]]
name = "gnomef-rs"
path = "src/bin/gnomef-rs.rs"

[[bin]]
name = "gnomef-agent"
path = "src/bin/gnomef-agent.rs"
test = false
bench = false

[[bin]]
name = "gnomef-whatsapp"
path = "src/main.rs"

[[bin]]
name = "gnomeai-desktop-a11y"
path = "src/bin/gnomeai-desktop-a11y.rs"
test = false
bench = false

[[bin]]
name = "gnomeai-node"
path = "src/bin/gnomeai-node.rs"
test = false
bench = false

[[bin]]
name = "gnomeai-hubctl"
path = "src/bin/gnomeai-hubctl.rs"
test = false
bench = false

[lib]
name = "gnomeai_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
ignore = "0.4"
libc = "0.2"
mime_guess = "2"
qrcode = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
safelog = "=0.9.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
arti-client = { version = "=0.46.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "static-sqlite"] }
tor-hsservice = "=0.46.0"
tor-cell = "=0.46.0"
tor-proto = "=0.46.0"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio", "zbus"] }
landlock = "0.4.5"
seccompiler = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
pdf-extract = "0.7"
