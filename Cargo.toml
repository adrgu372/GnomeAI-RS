[package]
name = "gnomef-rs"
version = "2.0.0"
edition = "2024"
autobins = false
default-run = "gnomef-rs"

[[bin]]
name = "gnomef-rs"
path = "src/bin/gnomef-rs.rs"

[[bin]]
name = "gnomef-agent"
path = "src/bin/gnomef-agent.rs"
test = false
bench = false

[[bin]]
name = "gnomef-whatsapp"
path = "src/main.rs"

[[bin]]
name = "gnomeai-desktop-a11y"
path = "src/bin/gnomeai-desktop-a11y.rs"
test = false
bench = false

[[bin]]
name = "gnomeai-node"
path = "src/bin/gnomeai-node.rs"
test = false
bench = false

[[bin]]
name = "gnomeai-hubctl"
path = "src/bin/gnomeai-hubctl.rs"
test = false
bench = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
ignore = "0.4"
libc = "0.2"
mime_guess = "2"
qrcode = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rfd = "0.17.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio", "zbus"] }
landlock = "0.4.5"
seccompiler = "0.5"
