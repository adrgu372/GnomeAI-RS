<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- GnomeAI-RS agent icon: rounded dark tile, neon "G" speech bubble with
       device mesh nodes and an assist sparkle. Vector rebuild of promo/icon.png -->
  <defs>
    <linearGradient id="tile" x1="20" y1="16" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04283d"/>
      <stop offset="1" stop-color="#02131f"/>
    </linearGradient>
    <linearGradient id="stroke" x1="18" y1="12" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00a4fb"/>
      <stop offset="1" stop-color="#00ff7f"/>
    </linearGradient>
    <linearGradient id="mark" x1="26" y1="20" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d4fe"/>
      <stop offset="1" stop-color="#3ce97f"/>
    </linearGradient>
  </defs>

  <!-- transparent corners; rounded tile like the raster original -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#tile)"
        stroke="url(#stroke)" stroke-width="4"/>
  <rect x="20" y="20" width="88" height="88" rx="19" fill="none"
        stroke="#0ae0f5" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- mesh arc with device nodes (left arm of the G) -->
  <path d="M66 30 C40 32 26 48 25 64 C24 82 38 96 54 99"
        fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="63" cy="34" r="8" fill="url(#mark)"/>
  <circle cx="34" cy="64" r="8" fill="url(#mark)"/>
  <circle cx="56" cy="94" r="8" fill="url(#mark)"/>

  <!-- speech-bubble G bar -->
  <path d="M60 60 h34 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-6 l-7 8 -6-8 h-15 a8 8 0 0 1 -8-8 v-26 a8 8 0 0 1 8-8 z"
        fill="url(#mark)"/>
  <circle cx="72" cy="81" r="4" fill="#04283d"/>
  <circle cx="83" cy="81" r="4" fill="#04283d"/>
  <circle cx="94" cy="81" r="4" fill="#04283d"/>

  <!-- assist sparkle -->
  <path d="M96 24 C97 33 100 36 109 38 C100 40 97 43 96 52 C95 43 92 40 83 38 C92 36 95 33 96 24 z"
        fill="url(#mark)"/>
</svg>
